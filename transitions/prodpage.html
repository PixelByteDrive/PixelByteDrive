<!DOCTYPE html>
<html>
  <style>
    @keyframes bg {
      0% {
        opacity: 0;
        filter: blur(50px);
      }
      50% {
        opacity: 0;
        width: 200%;
        height: 200%;
        filter: blur(50px);
      }
      75% {
        opacity: 0.75;
      }
      100% {
        width: 100%;
        height: 100%;
        filter: blur(0px);
      }
    }
    @keyframes container {
      0% {
        top: 200%;
        filter: blur(24px);
      }
      50% {
        top: 175%;
        filter: blur(24px);
      }
      100% {
        top: 100%;
        filter: blur(0px);
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    #background {
      opacity: 0.75;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      animation-name: bg;
      animation-duration: 4s;
      width: 100%;
      height: 100%;
      transition: 0.75s;
    }
    #container {
      width: 90%;
      height: 90%;
      transform: translate(-50%,-100%);
      top: 100%;
      left: 50%;
      position: absolute;
      animation-name: container;
      animation-duration: 4s;
      transition: 0.75s;
      opacity: 0.75;
      overflow: hidden;
      color: black;
      background-color: white;
    }
    #seemore {
      width: 100%;
      height: 10%;
      position: absolute;
      transform: translate(-50%,-0%);
      left: 50%;
      transition: 0.75s;
      border: none;
      overflow: hidden;
      background: none;
      color: black;
    }
  </style>
  <img id="background" src="https://cdn.glitch.me/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Fwallpaper.webp?v=1637261928826">
  <div id="container">
    <button id="seemore">More</button>
    <h1 style="text-align:center; margin: 2em;">
      Welcome
    </h1>
  </div>
  <script>
    var open = false
    document.getElementById('seemore').onclick = function() {
     if(open == false) {
      open = true
      document.getElementById('container').style.height = "100%";
      document.getElementById('container').style.opacity = "1";
      document.getElementById('background').style.filter = "blur(48px)";
      document.getElementById('background').style.width = "200%";
      document.getElementById('background').style.height = "200%";
      document.getElementById('container').style.overflow = "show";
      document.getElementById('seemore').innerHTML = "Less";
      document.getElementById('container').style.width = "100%";
     } else {
      open = false
      document.getElementById('container').style.height = "90%";
      document.getElementById('container').style.opacity = "0.75";
      document.getElementById('background').style.filter = "blur(0px)";
      document.getElementById('background').style.width = "100%";
      document.getElementById('background').style.height = "100%";
      document.getElementById('container').style.overflow = "hidden";
      document.getElementById('seemore').innerHTML = "More";
      document.getElementById('container').style.width = "90%";
     }
    }
  </script>
</html>

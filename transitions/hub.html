<!DOCTYPE html>
<html>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap');
    h1 {
      color: white;
      font-size: 26px;
      text-indent: 10px;
      font-family: "Roboto", sans-serif;
    }
    html, body {
      overflow: hidden;
      background-color: #2b2b2b;
    }
    #bottomswitcher {
      background-color: black;
      width: 100%;
      height: 10%;
      position: absolute;
      top: 95%;
      left: 50%;
      transform: translate(-50%,-50%);
    }
    #title {
      background-color: black;
      width: 100%;
      height: 10%;
      position: absolute;
      top: 5%;
      left: 50%;
      transform: translate(-50%,-50%);
      overflow: hidden;
    }
    .button {
      width: 34%;
      height: 75%;
      position: absolute;
      transform: translate(-50%,-50%);
    }
    #one {
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 25%;
    }
    #two {
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
    }
    #three {
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 75%;
    }
    #home {
      position: absolute;
      top: 0%;
      transition: 0.5s;
    }
    #management {
      position: absolute;
      top: 100%;
      transition: 0.5s;
    }
    #account {
      position: absolute;
      top: 200%;
      transition: 0.5s;
    }
  </style>
  <body>
    <div id="title"><h1 id="home">Home</h1><h1 id="management">Management</h1><h1 id="account">Account</h1></div>
    <div id="bottomswitcher">
      <img id="one" class="button" onclick="home()" src="https://cdn.glitch.com/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Fhome_white_24dp.svg?v=1631904668679">
      <img id="two" class="button" onclick="management()" src="https://cdn.glitch.com/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Fbusiness_white_24dp.svg?v=1631904661916">
      <img id="three" class="button" onclick="account()" src="https://cdn.glitch.com/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Faccount_circle_white_24dp.svg?v=1631904665895">
    </div>
    <script>
      function home() {
        document.getElementById("home").style.top = "0%";
        document.getElementById("management").style.top = "100%";
        document.getElementById("account").style.top = "200%";
      }
      function account() {
        document.getElementById("home").style.top = "-200%";
        document.getElementById("management").style.top = "-100%";
        document.getElementById("account").style.top = "0%";
      }
      function management() {
        document.getElementById("home").style.top = "-100%";
        document.getElementById("management").style.top = "0%";
        document.getElementById("account").style.top = "100%";
      }
    </script>
  </body>
</html>

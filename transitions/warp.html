<!DOCTYPE html>
<html>
  <style>
    html, body {
      background-color: black;
      overflow: hidden;
    }
    .warp {
      background-color: white;
      position: absolute;
      top: 50%;
      left: 100%;
      width: 50%;
      height: 50%;
      transform: translate(-100%, -50%) perspective(400px) rotateY(-15deg);
      animation-name: transition1;
      animation-duration: 5s;
      animation-iteration-count: infinite;
    }
    iframe {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
  </style>
  <div class="warp"><iframe src="https://news-pager.glitch.me"></iframe></div>
</html>

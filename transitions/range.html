<!DOCTYPE html>
<html>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@800&display=swap');
    #loader {
      top: 50%;
      position: absolute;
      width: 50%;
      height: 100%;
      transform: translate(0%,-50%);
      background-color: white;
      border-radius: 50em;
      overflow: hidden;
      animation-name: loader;
      animation-duration: 0.5s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-out;
      transition: 0.1s;
    }
    #loaderouter {
      border-radius: 5em;
      position: absolute;
      background-color: black;
      border: 2.5px solid black;
      top: 75%;
      left: 50%;
      width: 50%;
      height: 0.5%;
      transform: translate(-50%,-50%);
      overflow: hidden;
    }
    #loading {
      position: absolute;
      top: 70%;
      left: 50%;
      font-size: 12pt;
      color: gray;
      font-family: "Open Sans", sans-serif;
      transition: 0.25s;
      transform: translate(-50%,-50%);
    }
    #range {
      position: absolute;
      top: 77.5%;
      left: 25%;
      font-size: 12pt;
      color: gray;
      font-family: "Open Sans", sans-serif;
      width: 50%;
    }
  </style>
  <h1 id="loading">
    50%
  </h1>
  <div id="loaderouter">
    <div id='loader'></div>
  </div>
  <input type="range" size="100" id="range">
  <script>
    document.getElementById('range').addEventListener('input', change)
    function change(){
      var input = document.getElementById('range')
      document.getElementById('loader').style.width = input.value + "%";
      document.getElementById('loading').style.opacity = "1";
      document.getElementById('loading').style.fontSize = "12pt";
      document.getElementById('loading').style.fontSize = "10pt";
      document.getElementById('loading').style.opacity = "0";
      setTimeout(function(){
        document.getElementById('loading').style.fontSize = "21pt";
        document.getElementById('loading').style.filter = "blur(8px)";
        document.getElementById('loading').style.opacity = "0";
      },125)
      setTimeout(function(){
        document.getElementById('loading').innerHTML = input.value + "%";
        document.getElementById('loading').style.fontSize = "12pt";
        document.getElementById('loading').style.left = input.value / 2 + 25 + "%";
        document.getElementById('loading').style.opacity = "1";
        document.getElementById('loading').style.filter = "blur(0px)";
      },250)
    };
  </script>
</html>

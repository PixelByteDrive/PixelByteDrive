<!DOCTYPE html>
<html>
  <style>
    html, body {
      background-color: #000000;
    }
    @keyframes wavehi {
      0% {
        transform: rotate(-45deg) translate(0%,-100%);
      }
      50% {
        transform: rotate(45deg) translate(0%,-100%);
      }
      100% {
        transform: rotate(-45deg) translate(0%,-100%);
      }
    }
    p {
      color: white;
      text-align: center;
    }
   #img {
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      animation-name: wavehi;
      animation-duration: 2s;
      animation-iteration-count: infinite;
    } 
  </style>
  <title>hi</title>
 <img id="img" src="https://cdn.discordapp.com/attachments/872618598907125831/897552934085197834/unknown.png">
    <style>
    #info {
      width: 25px;
      height: 25px;
      background-color: white;
      border-radius: 100%;
    }
    #infopane {
      opacity: 0;
      width: 0px;
      height: 0px;
      transition: 0.25s;
      position: absolute;
      top: 1%;
      background-color: white;
      border-radius: 1em;
      color: black;
      padding: 0.5em;
      overflow: hidden;
      font-size: 16pt;
    }
  </style>
  <img src="https://cdn.glitch.me/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Finfo_black_24dp.svg?v=1635794065584" id="info">
  <div id="infopane">
    Was originally to say hi to my friends using HTML5 technology.
  </div>
  <script>
    var toggle = false;
    document.getElementById('info').addEventListener('click', event => {
     if(toggle == false) {
      toggle = true
      document.getElementById('infopane').style.width = "150px";
      document.getElementById('infopane').style.height = "150px";
      document.getElementById('infopane').style.top = "5%";
      document.getElementById('infopane').style.opacity = "1";
     } else {
      toggle = false
      document.getElementById('infopane').style.width = "0px";
      document.getElementById('infopane').style.height = "0px";
      document.getElementById('infopane').style.top = "1%";
      document.getElementById('infopane').style.opacity = "0";
     }
    });
    document.getElementById('infopane').addEventListener('click', event => {
     if(toggle == false) {
      toggle = true
      document.getElementById('infopane').style.width = "150px";
      document.getElementById('infopane').style.height = "150px";
      document.getElementById('infopane').style.top = "5%";
      document.getElementById('infopane').style.opacity = "1";
     } else {
      toggle = false
      document.getElementById('infopane').style.width = "0px";
      document.getElementById('infopane').style.height = "0px";
      document.getElementById('infopane').style.top = "1%";
      document.getElementById('infopane').style.opacity = "0";
     }
    });
  </script>
</html>

<!DOCTYPE html>
<html>
  <style>
    html, body {
      background-color: #000000;
    }
    @keyframes wavehi {
      0% {
        transform: rotate(-45deg) translate(0%,-100%);
      }
      50% {
        transform: rotate(45deg) translate(0%,-100%);
      }
      100% {
        transform: rotate(-45deg) translate(0%,-100%);
      }
    }
    p {
      color: white;
      text-align: center;
    }
   #img {
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      animation-name: wavehi;
      animation-duration: 2s;
      animation-iteration-count: infinite;
    } 
  </style>
  <title>hi</title>
 <img id="img" src="https://cdn.discordapp.com/attachments/872618598907125831/897552934085197834/unknown.png">
</html>

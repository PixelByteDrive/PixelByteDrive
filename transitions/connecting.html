<!DOCTYPE html>
<html>
  <style>
    @keyframes connecting1 {
      0% {
        width: 250px;
        height: 250px;
      }
      60% {
        width: 100px;
        height: 100px;
      }
      100% {
        width: 250px;
        height: 250px;
      }
    }
    @keyframes connecting2 {
      0% {
        width: 200px;
        height: 200px;
      }
      50% {
        width: 100px;
        height: 100px;
      }
      100% {
        width: 200px;
        height: 200px;
      }
    }
    @keyframes inner {
      0% {
        width: 150px;
        height: 150px;
      }
      50% {
        width: 200px;
        height: 200px;
      }
      100% {
        width: 150px;
        height: 150px;
      }
    }
    html, body {
      background-color: black;
    }
    #outer {
      position: absolute;
      background-color: black;
      width: 250px;
      height: 250px;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      border-radius: 250px;
      border: 5px solid white;
      animation-name: connecting1;
      animation-duration: 3s;
      animation-iteration-count: infinite;
    }
    #second {
      position: absolute;
      background-color: black;
      width: 200px;
      height: 200px;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      border-radius: 250px;
      border: 5px solid white;
      animation-name: connecting2;
      animation-duration: 3s;
      animation-iteration-count: infinite;
    }
    #inner {
      position: absolute;
      background-color: white;
      width: 150px;
      height: 150px;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      border-radius: 100%;
      animation-name: inner;
      animation-duration: 3s;
      animation-iteration-count: infinite;
    }
  </style>
  <div id="outer">
    <div id="second">
      <div id="inner">
      </div>
    </div>
  </div>
</html>

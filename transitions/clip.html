<!DOCTYPE html>
<html>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: black;
    }
    @keyframes float {
      0% {
        top: 50%;
        box-shadow: -100px 50px 40px gray;
        transform: translate(-50%,-50%) skew(45deg,0deg) rotate(-15deg);
      }
      50% {
        top: 37.5%;
        box-shadow: -200px 100px 80px black;
        transform: translate(-50%,-50%) skew(45deg,0deg) rotate(-20deg);
      }
      100% {
        top: 50%;
        box-shadow: -100px 50px 40px gray;
        transform: translate(-50%,-50%) skew(45deg,0deg) rotate(-15deg);
      }
    }
    #div1 {
      width: 50%;
      height: 50%;
      position: absolute;
      top: 50%;
      background-color: black;
      transform: translate(-50%,-50%) skew(45deg,0deg) rotate(-15deg);
      background-color: white;
      box-shadow: -100px 50px 10px gray;
      animation-name: float;
      animation-duration: 5s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.5,0.5,0.5,0.5);
    }
    #div2 {
      width: 50%;
      height: 50%;
      position: absolute;
      top: 50%;
      left: 100%;
      background-color: black;
      transform: translate(-50%,-50%) skew(45deg,0deg) rotate(-15deg);
      background-color: white;
      box-shadow: -100px 50px 10px gray;
      animation-name: float;
      animation-duration: 5s;
      animation-iteration-count: infinite;
    }
  </style>
  <div id="div1">
  </div>
  <div id="div2">
  </div>
</html>

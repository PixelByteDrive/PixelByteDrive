<!DOCTYPE html>
<html>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@900&display=swap');
    #title {
      position: absolute;
      top: 2.5%;
      left: 2.5%;
      font-family: "Source Sans Pro", sans-serif;
      color: auto;
      transition: 0.5s;
    }
    #box1 {
      position: absolute;
      top: 35%;
      left: 15%;
      width: 25%;
      height: 25%;
      border: 2px solid black;
      border-radius: 1em;
      background-color: white;
      transition: 0.5s;
      transform: translate(-50%,-50%);
    }
    #box2 {
      transition: 0.5s;
      position: absolute;
      top: 35%;
      left: 50%;
      width: 25%;
      height: 25%;
      border: 2px solid black;
      border-radius: 1em;
      background-color: white;
      transform: translate(-50%,-50%);
    }
    #box3 {
      transition: 0.5s;
      position: absolute;
      top: 35%;
      left: 85%;
      width: 25%;
      height: 25%;
      border: 2px solid black;
      border-radius: 1em;
      background-color: white;
      transform: translate(-50%,-50%);
    }
  </style>
  <h1 id="title">
    Welcome
  </h1>
  <div id="box1"></div>
  <div id="box2"></div>
  <div id="box3"></div>
  <script>
    var box1open = false;
    var box2open = false;
    var box3open = false;
    document.getElementById('box1').onclick = function() {
     if(box1open == false) {
      box1open = true
      document.getElementById('box1').style.left = "50%";
      document.getElementById('box1').style.top = "50%";
      document.getElementById('box1').style.width = "75%";
      document.getElementById('box1').style.height = "75%";
      document.getElementById('box1').style.zIndex = "3";
      document.getElementById('title').style.filter = "blur(4px)";
      document.getElementById('box2').style.filter = "blur(4px)";
      document.getElementById('box3').style.filter = "blur(4px)";
      document.getElementById('box2').style.opacity = "0";
      document.getElementById('box3').style.opacity = "0";
      document.getElementById('box2').style.width = "0%";
      document.getElementById('box2').style.height = "0%";
      document.getElementById('box3').style.width = "0%";
      document.getElementById('box3').style.height = "0%";
     } else {
      box1open = false
      document.getElementById('box1').style.left = "15%";
      document.getElementById('box1').style.top = "35%";
      document.getElementById('box1').style.width = "25%";
      document.getElementById('box1').style.height = "25%";
      document.getElementById('box1').style.zIndex = "1";

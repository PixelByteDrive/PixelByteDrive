<!DOCTYPE html>
<html>
  <style>
    #div1 {
      width: 125px;
      height: 125px;
      background-color: #0178d4;
      position: fixed;
      top: 51%;
      left: 50.5%;
      transition: 0.5s;
      transition-timing-function: cubic-bezier(0,1,.5,1.25);
    }
    #div2 {
      width: 125px;
      height: 125px;
      background-color: #0178d4;
      position: fixed;
      top: 51%;
      left: 49.5%;
      transform: translate(-100%,0%);
      transition: 0.5s;
      transition-timing-function: cubic-bezier(0,1,.5,1.25);
    }
    #div3 {
      width: 125px;
      height: 125px;
      background-color: #0178d4;
      position: fixed;
      top: 49%;
      left: 49.5%;
      transform: translate(-100%,-100%);
      transition: 0.5s;
      transition-timing-function: cubic-bezier(0,1,.5,1.25);
    }
    #div4 {
      width: 125px;
      height: 125px;
      background-color: #0178d4;
      position: fixed;
      top: 49%;
      left: 50.5%;
      transform: translate(-0%,-100%);
      transition: 0.5s;
      transition-timing-function: cubic-bezier(0,1,.5,1.25);
    }
    #menu {
      width: 40%;
      height: 40%;
      top: 50%;
      left: 50%;
      position: absolute;
      transform: translate(-50%,-50%);
      border: 2px solid black;
      border-radius: 1em;
      transition: 0.5s;
      opacity: 0;
    }
  </style>
  <div id="div1"></div>
  <div id="div2"></div>
  <div id="div3"></div>
  <div id="div4"></div>
  <div id="menu"></div>
  <script>
    setTimeout(function(){
      document.getElementById('div1').style.width = "150px";
      document.getElementById('div1').style.height = "150px";
      document.getElementById('div2').style.width = "150px";
      document.getElementById('div2').style.height = "150px";
      document.getElementById('div3').style.width = "150px";
      document.getElementById('div3').style.height = "150px";
      document.getElementById('div4').style.width = "150px";
      document.getElementById('div4').style.height = "150px";
    },2000)
    setTimeout(function(){
      document.getElementById('div1').style.transitionTimingFunction = "cubic-bezier(1,0,1,0)";
      document.getElementById('div2').style.transitionTimingFunction = "cubic-bezier(1,0,1,0)";
      document.getElementById('div3').style.transitionTimingFunction = "cubic-bezier(1,0,1,0)";
      document.getElementById('div4').style.transitionTimingFunction = "cubic-bezier(1,0,1,0)";
      document.getElementById('div1').style.width = "0px";
      document.getElementById('div1').style.height = "0px";
      document.getElementById('div2').style.width = "0px";
      document.getElementById('div2').style.height = "0px";
      document.getElementById('div3').style.width = "0px";
      document.getElementById('div3').style.height = "0px";
      document.getElementById('div4').style.width = "0px";
      document.getElementById('div4').style.height = "0px";
      document.getElementById('div1').style.opacity = "0";
      document.getElementById('div2').style.opacity = "0";
      document.getElementById('div3').style.opacity = "0";
      document.getElementById('div4').style.opacity = "0";
    },4000)
    setTimeout(function(){
      document.getElementById('menu').style.opacity = "1";
      document.getElementById('menu').style.width = "50%";
      document.getElementById('menu').style.height = "50%";
    },4500)
  </script>
</html>

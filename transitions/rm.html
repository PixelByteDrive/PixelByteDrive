<!DOCTYPE html>
<html>
  <style>
    #outer {
      width: 250px;
      height: 250px;
      border-radius: 100%;
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      background-color: #000000;
    }
    #inner {
      width: 150px;
      height: 150px;
      border-radius: 100%;
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      background-color: white;
    }
    #trim {
      width: 150px;
      height: 150px;
      position: absolute;
      transform: translate(-50%,-50%) rotate(45deg);
      top: 62.5%;
      left: 50%;
      background-color: white;
    }
  </style>
  <div id="outer"></div>
  <div id="inner"></div>
  <div id="trim"></div>
</html>

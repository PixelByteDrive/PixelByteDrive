<!DOCTYPE html>
<html>
  <style>
    html, body {
      background-color: black;
      padding: 0;
      margin: 0;
    }
    #main {
      width: 125px;
      height: 125px;
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      background-color: #57ff57;
      border-radius: 100%;
      transition: 0.25s;
    }
    #dnd {
      width: 0;
      height: 25px;
      border-radius: 5em;
      top: 50%;
      left: 50%;
      position: absolute;
      transform: translate(-50%,-50%);
      background-color: black;
      transition: 0.25s;
      opacity: 0;
    }
    #idle {
      width: 100px;
      height: 100px;
      border-radius: 10em;
      top: 20%;
      left: 80%;
      position: absolute;
      transform: translate(-50%,-50%);
      background-color: black;
      transition: 0.25s;
      opacity: 0;
    }
    button {
      width: 12.5%;
      height: 5%;
    }
  </style>
  <div id="main"><div id="idle"></div></div>
  <div id="dnd"></div>
  <button id="onlineclick">Online</button>
  <button id="idleclick">Idle</button>
  <button id="dndclick">Do Not Disturb</button>
  <button id="offlineclick">Offline</button>
  <script>
    document.getElementById('onlineclick').onclick = function() {
      document.getElementById('idle').style.opacity = "0";
      document.getElementById('idle').style.top = "20%";
      document.getElementById('idle').style.left = "80%";
      document.getElementById('dnd').style.width = "0%";
      document.getElementById('dnd').style.height = "25px";
      document.getElementById('dnd').style.opacity = "0";
      document.getElementById('main').style.backgroundColor = "#57ff57";
    }
    document.getElementById('idleclick').onclick = function() {
      document.getElementById('idle').style.opacity = "1";
      document.getElementById('idle').style.top = "35%";
      document.getElementById('idle').style.left = "65%";
      document.getElementById('dnd').style.height = "25px";
      document.getElementById('dnd').style.width = "0%";
      document.getElementById('dnd').style.opacity = "0";
      document.getElementById('main').style.backgroundColor = "yellow";
    }
    document.getElementById('dndclick').onclick = function() {
      document.getElementById('idle').style.opacity = "0";
      document.getElementById('idle').style.top = "20%";
      document.getElementById('idle').style.left = "80%";
      document.getElementById('dnd').style.width = "100px";
      document.getElementById('dnd').style.height = "25px";
      document.getElementById('dnd').style.opacity = "1";
      document.getElementById('main').style.backgroundColor = "red";
    }
    document.getElementById('offlineclick').onclick = function() {
      document.getElementById('idle').style.opacity = "0";
      document.getElementById('idle').style.top = "50%";
      document.getElementById('idle').style.left = "50%";
      document.getElementById('dnd').style.width = "75px";
      document.getElementById('dnd').style.height = "75px";
      document.getElementById('dnd').style.opacity = "1";
      document.getElementById('main').style.backgroundColor = "gray";
    }
  </script>
</html>

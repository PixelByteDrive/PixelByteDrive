<!DOCTYPE html>
<html>
  <style>
    @keyframes connecting1 {
      0% {
        left: 25%;
      }
      50% {
        left: 75%;
      }
      100% {
        left: 25%;
      }
    }
    @keyframes connecting2 {
      0% {
        left: 75%;
      }
      50% {
        left: 25%;
      }
      100% {
        left: 75%;
      }
    }
    html,
    body {
      background-color: black;
    }
    #outer {
      position: absolute;
      background-color: yellow;
      width: 250px;
      height: 250px;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      border-radius: 250px;
      animation-name: connecting1;
      animation-duration: 5s;
      animation-iteration-count: infinite;
    }
    #second {
      position: absolute;
      background-color: blue;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      border-radius: 250px;
      animation-name: connecting2;
      animation-duration: 5s;
      animation-iteration-count: infinite;
      opacity: 50%;
    }
  </style>
  <div id="outer">
  </div>
  <div id="second">
  </div>
  <style>
    #info {
      width: 25px;
      height: 25px;
      background-color: white;
      border-radius: 100%;
    }
    #infopane {
      opacity: 0;
      width: 0px;
      height: 0px;
      transition: 0.25s;
      position: absolute;
      top: 1%;
      background-color: white;
      border-radius: 1em;
      color: black;
      padding: 0.5em;
      overflow: hidden;
      font-size: 16pt;
    }
  </style>
  <img src="https://cdn.glitch.me/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Finfo_black_24dp.svg?v=1635794065584" id="info">
  <div id="infopane">
    Color mixing using transparency.
  </div>
  <script>
    var toggle = false;
    document.getElementById('info').addEventListener('click', event => {
     if(toggle == false) {
      toggle = true
      document.getElementById('infopane').style.width = "150px";
      document.getElementById('infopane').style.height = "150px";
      document.getElementById('infopane').style.top = "5%";
      document.getElementById('infopane').style.opacity = "1";
     } else {
      toggle = false
      document.getElementById('infopane').style.width = "0px";
      document.getElementById('infopane').style.height = "0px";
      document.getElementById('infopane').style.top = "1%";
      document.getElementById('infopane').style.opacity = "0";
     }
    });
    document.getElementById('infopane').addEventListener('click', event => {
     if(toggle == false) {
      toggle = true
      document.getElementById('infopane').style.width = "150px";
      document.getElementById('infopane').style.height = "150px";
      document.getElementById('infopane').style.top = "5%";
      document.getElementById('infopane').style.opacity = "1";
     } else {
      toggle = false
      document.getElementById('infopane').style.width = "0px";
      document.getElementById('infopane').style.height = "0px";
      document.getElementById('infopane').style.top = "1%";
      document.getElementById('infopane').style.opacity = "0";
     }
    });
  </script>
</html>

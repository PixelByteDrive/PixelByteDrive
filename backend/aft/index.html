<!DOCTYPE html>
<html>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@900&display=swap");
    html,
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #sidebar {
      position: absolute;
      width: 15%;
      height: 100%;
      background-color: #121212;
      transition: 1s;
    }
    #selected {
      border: 2px solid white;
      height: 5%;
      position: absolute;
      transform: translate(-50%, -50%);
      top: 25%;
      left: 25%;
      transition: 0.5s;
    }
    #logo {
      width: 50%;
      height: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      object-fit: contain;
      top: 12.5%;
      left: 50%;
    }
    #home {
      width: 25%;
      height: 10%;
      position: absolute;
      transform: translate(-50%, -50%);
      object-fit: contain;
      top: 25%;
      left: 50%;
    }
    #shop {
      width: 25%;
      height: 10%;
      position: absolute;
      transform: translate(-50%, -50%);
      object-fit: contain;
      top: 35%;
      left: 50%;
    }
    #homepage {
      width: 85%;
      height: 100%;
      position: absolute;
      left: 15%;
      transition: 0.5s;
    }
    #homepage h1 {
      font-size: 24pt;
      color: white;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Source Sans Pro", sans-serif;
    }
    #homepage p {
      font-size: 16pt;
      color: white;
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Source Sans Pro", sans-serif;
    }
    #homepage #below {
      font-size: 16pt;
      color: white;
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Source Sans Pro", sans-serif;
    }
    #shoppage {
      width: 85%;
      height: 100%;
      position: absolute;
      left: 15%;
      top: 100%;
      transition: 0.5s;
    }
    #shoppage h1 {
      font-size: 24pt;
      color: white;
      position: absolute;
      top: 5%;
      left: 7.5%;
      transform: translate(-50%, -50%);
      font-family: "Source Sans Pro", sans-serif;
    }
    #shoppage p {
      font-size: 16pt;
      color: white;
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: "Source Sans Pro", sans-serif;
    }
  </style>
  <div id="sidebar">
    <img
      id="logo"
      title="logo"
      src="https://cdn.glitch.me/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Fb5ec726b-25d8-4266-bcaa-c26d2b0406d2.image.png?v=1636342830339"
    />
    <img
      id="home"
      title="home"
      src="https://cdn.glitch.com/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Fhome_white_24dp.svg?v=1631904668679"
    />
    <img
      id="shop"
      title="shop"
      src="https://cdn.glitch.me/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Fshopping_basket_white_48dp.svg?v=1636343332996"
    />
    <div id="selected"></div>
  </div>
  <div id="homepage">
    <h1>
      Home
    </h1>
    <p>
      All your favorites, in one page.
    </p>
    <p id="below">
      (though we wish it was better)
    </p>
  </div>
  <div id="shoppage">
    <h1>
      Shop
    </h1>
  </div>
  <script>
    var home = true
    document.getElementById("home").onclick = function() {
      document.getElementById("homepage").style.top = "0%";
      document.getElementById("shoppage").style.top = "100%";
    if(home == false) {
      home = true
      document.getElementById("selected").style.height = "10%";
      document.getElementById("selected").style.top = "25%";
      setTimeout(function(){
        document.getElementById("selected").style.height = "5%";
      },200)
     }
    };
    document.getElementById("shop").onclick = function() {
        document.getElementById("homepage").style.top = "-100%";
        document.getElementById("shoppage").style.top = "0%";
      if(home == true) {
        home = false
        document.getElementById("selected").style.height = "10%";
        document.getElementById("selected").style.top = "35%";
        setTimeout(function(){
          document.getElementById("selected").style.height = "5%";
        },200)
      }
    };
  </script>
</html>

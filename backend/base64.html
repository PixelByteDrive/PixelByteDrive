<!DOCTYPE html>
<html>
  <style>
    html, body {
      padding: 0;
      margin: 0;
    }
    #textarea {
      margin: 1em;
      width: 75%;
      height: 250px;
      resize: none;
    }
    button {
      margin: 1em;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Base64/1.1.0/base64.min.js"></script>
  <textarea id="textarea"></textarea>
  <br>
  <button id="encode">
    Encode
  </button>
  <button id="decode">
    Decode
  </button>
  <script>
    var Base64 = require("Base64.min.js");
    document.getElementById('encode').onclick = yes();
    function yes() {
      var encode = Base64.btoa(document.getElementById('textarea').value)
      document.getElementById('textarea').value = encode;
    }
    document.getElementById('decode').onclick = no();
    function no() {
      var decode = Base64.atob(document.getElementById('textarea').value)
      document.getElementById('textarea').value = decode;
    }
  </script>
</html>

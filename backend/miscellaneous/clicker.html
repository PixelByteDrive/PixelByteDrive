<!DOCTYPE html>
<html>
  <title>clicker</title>
  <body>
    <h1 style="text-align:center;">
      -- Clicker Game --
    </h1>
    <p>
      You clicked this button <b id="counter">0</b> times.
    </p>
    <button id="clickbutton" onclick="click()">
      Click
    </button>
    <script>
      var clickbutton = document.getElementById("clickbutton")
      var counter = document.getElementById("counter")
      var count = 0
      function click() {
        count = count + 1;
        counter.innerHTML = count;
      }
    </script>
  </body>
</html>

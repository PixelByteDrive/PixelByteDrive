<!DOCTYPE html>
<html>
  <style>
    button {
      border: none;
      background-color: white;
      width: 100px;
      height: 100px;
    }
  </style>
  <p id="space" style="text-align: center;">
    You clicked the space bar 0 times!
  </p>
  <button onclick="add()">
  </button>
  <script>
    var number = 0
    document.body.onkeyup = function(e){
    if(e.keyCode == 32){
        number = number + 1
        document.getElementById('space').innerHTML = "You clicked the space bar " + number + " times!"
      }
    }
    function add() {
      number = number + 10000
      document.getElementById('space').innerHTML = "You clicked the space bar " + number + " times!"
    }
  </script>
</html>

<!DOCTYPE html>
<html lang="en">
  <meta id="theme" name="theme-color" content="#f0f0f2" />
  <div>
    <img
      class="animationdiv"
      src="https://cdn.glitch.com/6a3c2156-cafb-4954-b2d1-547a4cbd1b97%2Fpixel.png?v=1614362359638"
      style="width:150px;height:150px;"
    />
  </div>
  <head>
    <title>Authentication Required</title>
    <link
      rel="stylesheet"
      href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css"
    />
    <link
      rel="icon"
      type="image/svg"
      href="https://cdn.glitch.com/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Flock.svg?v=1618241706445"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <script src="//code.jquery.com/jquery-1.12.4.js"></script>
    <script src="//code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Open+Sans:wght@700;800&family=Ubuntu:wght@700&display=swap");
      @keyframes check {
        0% {
          width: 50px;
          height: 50px;
          opacity: 0;
        }
        25% {
          width: 150px;
          height: 150px;
          opacity: 1;
        }
        75% {
          width: 150px;
          height: 150px;
          opacity: 1;
        }
        100% {
          width: 50px;
          height: 50px;
          opacity: 0;
        }
      }
      @keyframes thing {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .animationdiv {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        position: fixed;
        text-align: center;
        border-radius: 100%;
        font-family: "Roboto", sans-serif;
        animation-name: thing;
        animation-duration: 0.5s;
        animation-iteration-count: 1;
        z-index: 3;
        opacity: 0;
      }
      #frame {
        max-width: 400px;
        margin: 5px;
        border: solid #AAAAAA 1px;
        border-radius: 1em;
        box-shadow: 3px 3px 5px 3px #AAAAAA;
        margin-left: auto;
        margin-right: auto;
        background-color: #333333;
        overflow: hidden;
        text-align: left;
      }
      #dialogText {
        padding: 10px 30px;
        color: white;
        text-align: center;
      }
      div.submitbuttonandrew {
        background-color: #333333;
      }
      h1 {
        color: auto;
        font-family: "Ubuntu", sans-serif;
      }
      input,
      button {
        text-align: center;
        margin: auto;
        display: flex;
        justify-content: center;
        font-family: "Open Sans", sans-serif;
        border-radius: 1em;
        border: 1px solid black;
        color: auto;
      }
      p.prompt {
        text-align: center;
        font-family: "Ubuntu", sans-serif;
        color: auto;
      }
      body {
        background-color: #f0f0f2;
        margin: 0;
        padding: 0;
      }
      button {
        width: 25%;
        transition: all 0.5s;
        background-color: #ffffff;
        color: #000000;
      }
      button:hover {
        background-color: black;
        color: white;
        cursor: pointer;
      }
      button:focus,
      button:active {
        color: #ffffff;
        background-color: #000000;
        cursor: progress;
      }
      div.hilolz {
        background-color: white;
      }
      .button span {
        cursor: pointer;
        display: inline-block;
        position: relative;
        transition: 0.25s;
        text-align: center;
      }
      .button span:after {
        content: "\00bb";
        vertical-align: middle;
        position: absolute;
        opacity: 0;
        top: 0;
        right: 0px;
      }
      .button:hover span {
        padding-right: 10px;
      }

      .button:hover span:after {
        opacity: 1;
        right: 0;
      }
      #textelement {
        text-align: center;
        font-family: "Open Sans", sans-serif;
        color: ##cccccc;
        font-size: 8px;
        transition: 0.5s;
      }
      .back {
        color: white;
        background-color: #bfbfbf;
        border-radius: 0.5em;
        transition: 0.5s;
      }
      .back:hover {
        border-radius: 100%;
      }
      iframe {
        width: 0;
        height: 0;
        border: 0px solid black;
      }
    </style>
  </head>
  <body style="vertical-align:middle">
    <br class="br" /><br class="br" />
    <div id="frame" class="animate__animated animate__zoomInUp">
      <div id="dialogText">
        <img
          src="https://cdn.glitch.com/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Ffast_rewind_black_48dp.svg?v=1617743871679"
          onclick="window.history.back()"
          class="back"
        />
        <h1 id="text">
          <img
            src="https://cdn.glitch.com/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Fadmin-settings-male.png?v=1618241627360"
            id="logo"
            width="100px"
            height="50%"
          /><br />
          Authentication Portal
        </h1>
      </div>
      <div class="hilolz" type="form">
        <p class="prompt">
          <br />
          Sign In to Continue
        </p>
        <div id="toggle">
          <h4 id="textelement">Enter Password</h4>
        </div>
        <input
          type="password"
          placeholder="Administrator Password"
          id="password"
          required
        /><br />
        <div class="submitbuttonandrew">
          <br />
          <button
            type="submit"
            id="submit"
            class="button"
            style="vertical-align:middle"
          >
            <span>Login</span>
          </button>
          <br />
        </div>
      </div>
    </div>
  </body>
  <footer>
    <script src="../scripts/SHA.js"></script>
    <script>
      var submit = document.getElementById("submit");
      var password = document.getElementById("password");
      var textelement = document.getElementById("textelement");
      var confirm = "d033e22ae348aeb5660fc2140aec35850c4da997";
      submit.onclick = function() {
        if (SHA1(password.value) == confirm) {
          textelement.style.color = "#009933";
          textelement.innerHTML = "Access Granted";
          document.cookie = "unlocked=yes";
          setTimeout(function() {
            setTimeout(function() {
              $(".br").remove();
            }, 450);
            $("#frame").toggle("scale");
            $("#identification").show("slow");
            document.getElementById("animationdiv").style.animation =
              "check 2s 1";
          }, 1000);
        } else {
          $("#password").effect("shake");
          textelement.innerHTML = "Access Denied";
          textelement.style.color = "#ff0000";
        }
      };
      document.addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
          if (SHA1(password.value) == confirm) {
            textelement.style.color = "#009933";
            textelement.innerHTML = "Access Granted";
            document.cookie = "unlocked=yes";
            setTimeout(function() {
              setTimeout(function() {
                $(".br").remove();
              }, 450);
              $("#frame").toggle("scale");
              $("#identification").show("slow");
              document.getElementById("animationdiv").style.animation.name =
                "check";
            }, 1000);
          } else {
            textelement.innerHTML = "Access Denied";
            textelement.style.color = "#ff0000";
            $("#password").effect("shake");
          }
        }
      });
    </script>
  </footer>
</html>

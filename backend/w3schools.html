<!DOCTYPE html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <style>
    @keyframes animation {
      0% {border-radius: 0em; transform: skew(20deg, 10deg) translate(50%, 10%); width: 45%; opacity: 0; box-shadow: 0 0px 0px;}
      100% {transform: skew(10deg, 5deg) translate(50%, 0%); width: 50%; opacity: 1;}
    }
    img {
      animation-name: animation;
      animation-duration: 1s;
      transform: skew(10deg, 5deg) translate(50%, 0%);
      width: 50%;
      position: relative;
      border: 2.5px solid black;
      border-radius: 2em;
      box-shadow: 0 3px 20px;
    }
  </style>

</html>

<!DOCTYPE html>
<html>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;900&display=swap');
    @keyframes head {
      0% {
        top: 65%;
      }
      50% {
        top: 67.5%;
      }
      100% {
        top: 65%;
      }
    }
    @keyframes para {
      0% {
        top: 70%;
      }
      25% {
        top: 75%;
      }
      100% {
        top: 70%;
      }
    }
    h1 {
      color: white;
      position: absolute;
      transform: translate(-50%,-50%);
      top: 65%;
      left: 50%;
      font-family: "Source Sans Pro", sans-serif;
      animation-name: head;
      animation-duration: 5s;
      animation-iteration-count: infinite;
    }
    p {
      color: white;
      position: absolute;
      transform: translate(-50%,-50%);
      top: 70%;
      left: 50%;
      font-family: "Source Sans Pro", sans-serif;
      animation-name: para;
      animation-duration: 5s;
      animation-iteration-count: infinite;
    }
    @keyframes below {
      0% {
        width: 0%;
      }
      50% {
        width: 5%;
      }
      100% {
        width: 0%;
      }
    }
    @keyframes arrow {
      0% {
        top: 50%;
      }
      50% {
        top: 55%;
      }
      100% {
        top: 50%;
      }
    }
    html, body {
      background-color: black;
    }
    #arrow {
      width: 10%;
      height: 10%;
      object-fit: contain;
      position: absolute;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      animation-name: arrow;
      animation-duration: 1s;
      animation-iteration-count: infinite;
    }
    #below {
      width: 5%;
      border: 5px solid white;
      object-fit: contain;
      position: absolute;
      transform: translate(-50%,-50%);
      top: 60%;
      left: 50%;
      animation-name: below;
      animation-duration: 1s;
      animation-iteration-count: infinite;
      border-radius: 1em;
    }
  </style>
  <img id="arrow" src="https://cdn.glitch.me/c5a2c49e-e6a6-462b-bc27-6589c7056565%2Farrow_downward_white_48dp.svg?v=1636401697679">
  <div id="below"></div>
  <h1>
    Updating PixelByteDrive...
  </h1>
  <p>
    Should be more like a maintenance.
  </p>
</html>

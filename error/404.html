<!DOCTYPE html>
<html>
  <head>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
  </head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    html, body {
      background-color: #222222;
    }
    .everything {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      position: fixed;
      text-align: center;
      color: #ffffff;
      font-family: "Roboto", sans-serif;
    }
    ins {
      color: #777;
      text-decoration: none;
    }
  </style>
  <title>404 - Page Not Found</title>
  <div class="everything">
  <h1 class="animate__animated animate__jello">
    404. <ins title="Because the page doesn't exist!">Now that's an error we can't fix.</ins>
  </h1>
  <h3 class="animate__animated animate__fadeInUpBig">
    The requested URL was not found on this server. <code>} // end of reference</code>
  </h3>
  </div>
</html>
